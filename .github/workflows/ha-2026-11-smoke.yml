name: HA 2026.11 integration API smoke
on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  real-home-assistant-imports:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Home Assistant 2026.11.0
        run: python -m pip install 'homeassistant==2026.11.0'
      - name: Validate integration imports and 2026.11 API contracts
        run: python -m unittest discover -s ha_smoke -p 'test_*.py' -v
