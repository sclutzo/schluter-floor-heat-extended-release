# For HA-Schluter-DEV: extended UI integration and climate.bath_heat_2.
# The YAML is an example; change entity/service_domain for other installations.
type: picture-elements
image: /local/Thermostat.svg
elements:
  - type: custom:bathroom-heat-status
    service_domain: schluter_heat_extended
    entity: climate.bath_heat_2
    field: clock
    style:
      top: 24%
      left: 50%
      transform: translate(-50%, -50%)
      font-size: 14px
      font-weight: 400
      color: '#111'
  - type: custom:bathroom-heat-status
    service_domain: schluter_heat_extended
    entity: climate.bath_heat_2
    field: current
    style:
      top: 27%
      left: 50%
      transform: translate(-50%, -50%)
      font-size: 14px
      font-weight: 420
      color: '#111'
  - type: custom:bathroom-heat-target
    service_domain: schluter_heat_extended
    entity: climate.bath_heat_2
    style:
      top: 40%
      left: 36%
      transform: translate(-50%, -50%)
      font-size: 45px
      font-weight: 450
      color: '#111'
  - type: icon
    icon: mdi:temperature-fahrenheit
    style:
      top: 38%
      left: 48%
      transform: translate(-50%, -50%)
      font-size: 10px
      color: '#111'
  - type: state-label
    entity: climate.bath_heat_2
    attribute: hvac_action
    style:
      top: 56%
      left: 50%
      transform: translate(-50%, -50%)
      font-size: 12px
      line-height: 1.1
      color: '#333'
  - type: custom:bathroom-heat-status
    service_domain: schluter_heat_extended
    entity: climate.bath_heat_2
    field: mode
    style:
      top: 50%
      left: 36%
      transform: translate(-50%, -50%)
      font-size: 12px
      line-height: 1.1
      color: '#333'
  - type: custom:bathroom-heat-status
    service_domain: schluter_heat_extended
    entity: climate.bath_heat_2
    field: expiration
    style:
      top: 59%
      left: 50%
      transform: translate(-50%, -50%)
      font-size: 11px
      line-height: 1.1
      width: 90%
      text-align: center
      color: '#555'
  - type: icon
    icon: mdi:arrow-up-bold
    tap_action:
      action: fire-dom-event
      bathroom_heat:
        entity: climate.bath_heat_2
        action: step
        step: 1
    style:
      top: 40%
      left: 65%
      width: 60px
      height: 25px
      display: flex
      align-items: center
      justify-content: center
      transform: translate(-50%, -50%)
      font-size: 20px
      color: '#333'
      iron-icon-width: 20px
      iron-icon-height: 20px
      background: '#d9d9d9'
      border-radius: 6px
      padding: 6px
      border: 2px solid rgba(0,0,0,0.25)
      box-shadow: 0 2px 0 rgba(255,255,255,0.6) inset, 0 2px 6px rgba(0,0,0,0.15)
  - type: icon
    icon: mdi:arrow-down-bold
    tap_action:
      action: fire-dom-event
      bathroom_heat:
        entity: climate.bath_heat_2
        action: step
        step: -1
    style:
      top: 47%
      left: 65%
      transform: translate(-50%, -50%)
      font-size: 20px
      width: 60px
      height: 25px
      color: '#333'
      outline: black
      background: '#d9d9d9'
      display: flex
      align-items: center
      justify-content: center
      border-radius: 6px
      padding: 6px
      border: 2px solid rgba(0,0,0,0.25)
      box-shadow: 0 2px 0 rgba(255,255,255,0.6) inset, 0 2px 6px rgba(0,0,0,0.15)
  - type: image
    image: /local/Adjust.svg
    tap_action:
      action: fire-dom-event
      bathroom_heat:
        entity: climate.bath_heat_2
        action: adjust
    style:
      top: 65%
      left: 50%
      width: 50%
      transform: translate(-50%, -50%)
  - type: conditional
    conditions:
      - condition: state
        entity: climate.bath_heat_2
        attribute: override_active
        state: 'true'
    elements:
      - type: image
        image: /local/ReturnToSchedule.svg
        tap_action:
          action: fire-dom-event
          bathroom_heat:
            entity: climate.bath_heat_2
            action: return_to_schedule
        style:
          top: 72%
          left: 50%
          width: 50%
          transform: translate(-50%, -50%)
  - type: custom:bathroom-heat-schedule-button
    service_domain: schluter_heat_extended
    entity: climate.bath_heat_2
    style:
      top: 85%
      left: 50%
      width: 50%
      transform: translate(-50%, -50%)
      font-size: 12px
      color: '#333'
